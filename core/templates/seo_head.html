<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% if noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="TopMap Solutions">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ image }}">
<meta property="og:image:alt"
      content="City planning drawing with buildings and green spaces">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ image }}">
<script type="application/ld+json">{{ organization_json|safe }}</script>
