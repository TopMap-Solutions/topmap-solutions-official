name: CI/CD TopMap Solutions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: topmap-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test Django
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          load: true
          push: false
          tags: topmap-solutions:${{ github.sha }}
          cache-from: type=gha,scope=topmap-production
          cache-to: type=gha,mode=max,scope=topmap-production

      - name: Run all Django tests
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            topmap-solutions:${{ github.sha }} \
            python manage.py test

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 60m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd ~/myapps/topmap-solutions-official

            git fetch origin main
            git reset --hard "$DEPLOY_SHA"

            export DOCKER_BUILDKIT=1
            docker-compose -f .docker/docker-compose.yml up -d --build

            docker image prune -f
            echo "--- TopMap Solutions Deployment Complete ---"
