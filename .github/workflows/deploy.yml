name: CI/CD TopMap Solutions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: topmap-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Django
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for tests
        run: docker build -f .docker/Dockerfile -t topmap-test:latest .

      - name: Run all Django tests
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            topmap-test:latest \
            python manage.py test

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -f .docker/Dockerfile -t topmap-solutions:latest .

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd ~/myapps/topmap-solutions-official

            git fetch origin main
            git reset --hard "$DEPLOY_SHA"

            export DOCKER_BUILDKIT=1
            docker-compose -f .docker/docker-compose.yml up -d --build

            docker image prune -f
            echo "--- TopMap Solutions Deployment Complete ---"
