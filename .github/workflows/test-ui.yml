name: UI and SEO regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          version: "0.12.18"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check the public site without database setup or migrations
        run: make test-ui
