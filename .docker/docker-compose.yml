services:
  web:
    build:
      context: ../
      dockerfile: .docker/Dockerfile
    container_name: topmapsolutions-official

    env_file:
      - ../.env.prod

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    ports:
      - "8000:8000"

    restart: unless-stopped
    networks:
      - gis_centralize_db

networks:
  gis_centralize_db:
    external: true
